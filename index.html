<style>
:root{
  --bg1:#080c26; --bg2:#141a4a; --bg3:#2a1650;
  --gold:#f5c76a; --gold2:#ffe6a8; --goldd:#c8963a;
  --text:#f6f3ec; --muted:#b9bddb;
  --card:rgba(18,24,66,.72); --card2:rgba(255,255,255,.07);
  --line:rgba(245,199,106,.28);
  --ok:#6ee7a8; --warn:#ffd166; --bad:#ff8a8a;
  --m:#6aa8ff; --f:#ff8fc2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;
  background:
    radial-gradient(900px 600px at 85% -10%, rgba(255,190,90,.22), transparent 60%),
    radial-gradient(700px 600px at -10% 20%, rgba(120,90,255,.28), transparent 60%),
    radial-gradient(800px 700px at 50% 120%, rgba(255,120,170,.18), transparent 60%),
    linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:12px 16px 8px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;font-weight:700}
h2{font-size:24px;color:var(--gold2);margin:6px 0 4px}
h3{font-size:18px;color:var(--gold2)}
p{margin:.4em 0}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}

/* TOP BAR: музыка, язык, вкладки */
.top{position:sticky;top:0;z-index:5;background:rgba(8,12,38,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .in{max-width:720px;margin:0 auto;padding:6px 8px 4px}
.bar1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.brand{font-family:Georgia,serif;font-size:14px;color:var(--gold2);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:0 0 auto}
.lang button{background:none;border:0;color:var(--muted);padding:7px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer}
.lang button.on{background:linear-gradient(180deg,#ffe3a0,#e1a843);color:#2a1a00}
.mus{margin:10px auto 2px;max-width:420px}
.mrow{display:flex;gap:8px;justify-content:center}
.mt{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:99px;padding:7px 8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt.on{border-color:var(--gold);background:rgba(245,199,106,.16);color:var(--gold2)}
.mseek{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.mseek input[type=range]{flex:1;min-width:0;width:auto;padding:0;border:0;background:none;accent-color:#e1a843;height:24px;margin:0;box-shadow:none}
nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
nav button{background:none;border:0;color:var(--muted);padding:4px 0 3px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;border-radius:10px;min-width:0}
nav button i{font-style:normal;font-size:19px;filter:grayscale(.6)}
nav button span{max-width:100%;overflow:hidden;white-space:nowrap}
nav button.on{color:var(--gold2);background:rgba(245,199,106,.12)}
nav button.on i{filter:none}

/* HERO */
.hero{text-align:center;padding:18px 8px 10px}
.eyebrow{letter-spacing:.28em;font-size:12px;color:var(--gold);text-transform:uppercase}
.big{
  font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:.9;
  font-size:clamp(120px,36vw,200px);margin:8px 0 0;
  background:linear-gradient(180deg,#fff6d6 0%,#f5c76a 45%,#b9812a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 30px rgba(245,199,106,.35));
}
.yrs{font-family:Georgia,serif;font-size:clamp(24px,7vw,40px);letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin-top:-6px}
.line{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto;width:80%}
.date{font-family:Georgia,serif;font-size:clamp(24px,7vw,34px);color:#fff}
.date small{display:block;font-family:system-ui,sans-serif;font-size:14px;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 6px}
.count div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.count b{display:block;font-family:Georgia,serif;font-size:28px;color:var(--gold2);font-variant-numeric:tabular-nums}
.count span{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}

/* CARDS */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card2);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:Georgia,serif;font-size:30px;color:var(--gold2)}
.stat span{font-size:12px;color:var(--muted)}
.stat.m b{color:var(--m)} .stat.f b{color:var(--f)}
.gbar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:12px 0 4px;background:#0003}
.gbar i{display:block;height:100%}
.gleg{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

/* FORMS */
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{
  width:100%;background:rgba(5,8,30,.65);border:1px solid rgba(245,199,106,.35);border-radius:12px;padding:12px;outline:none
}
input::placeholder,textarea::placeholder{color:#8f94bd}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,199,106,.18)}
select option{background:#141a4a;color:#fff}
textarea{min-height:90px;resize:vertical}
.btn{
  display:inline-block;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;
  background:linear-gradient(180deg,#ffe3a0,#e1a843);color:#2a1a00;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row>.btn{flex:0 0 auto}

/* CHIPS */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip.on{background:linear-gradient(180deg,#ffe3a0,#e1a843);color:#2a1a00;font-weight:700;border-color:transparent}

/* PEOPLE */
.person{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
.person:last-child{border-bottom:0}
.person.tap{cursor:pointer;border-radius:12px;padding-left:8px;padding-right:8px}
.person.me{background:rgba(245,199,106,.12);box-shadow:inset 0 0 0 1px var(--gold)}
.mark{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.04em}
.attpick{padding:8px 4px 12px}
.attpick h4{margin:0 0 6px;font-size:14px;color:var(--gold2)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#0b1030;flex:0 0 auto}
.av.m{background:linear-gradient(135deg,#bcd7ff,#6aa8ff)}
.av.f{background:linear-gradient(135deg,#ffd0e6,#ff8fc2)}
.av.t{background:linear-gradient(135deg,#ffe9b0,#f5c76a)}
.pname{flex:1;min-width:0}
.pname b{display:block;font-weight:600;overflow-wrap:anywhere}
.pname span{font-size:12px;color:var(--muted)}
.badge{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.2);white-space:nowrap}
.badge.yes{color:var(--ok);border-color:#6ee7a866}
.badge.likely{color:var(--warn);border-color:#ffd16666}
.badge.maybe{color:var(--muted)}
.badge.no{color:var(--bad);border-color:#ff8a8a66}
.badge.online{color:var(--m);border-color:#6aa8ff66}

/* POLLS */
.poll{padding:0;overflow:hidden}
.poll>summary{list-style:none;cursor:pointer;padding:16px;display:flex;gap:12px;align-items:flex-start}
.poll>summary::-webkit-details-marker{display:none}
.poll .qi{font-size:26px}
.poll .qt{flex:1}
.poll .qt b{display:block;font-size:17px;line-height:1.3}
.poll .qt span{font-size:13px;color:var(--muted)}
.poll .chev{color:var(--gold);transition:transform .2s;font-size:18px;margin-top:2px}
.poll[open] .chev{transform:rotate(90deg)}
.pbody{padding:0 16px 16px}
.opt{position:relative;display:block;width:100%;text-align:left;margin:8px 0;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(5,8,30,.55);padding:12px 14px;overflow:hidden;cursor:pointer}
.opt .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(245,199,106,.38),rgba(245,199,106,.18));width:0;transition:width .5s}
.opt .in{position:relative;display:flex;gap:10px;align-items:center;justify-content:space-between}
.opt .lab{flex:1;overflow-wrap:anywhere}
.opt .num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold2);white-space:nowrap}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,199,106,.25)}
.opt.sel .lab::before{content:"✓ ";color:var(--gold)}
.opt.lead{border-color:rgba(245,199,106,.7)}
.meta{font-size:13px;color:var(--muted);margin:8px 0}
.names{font-size:13px;color:var(--muted);margin:6px 0 2px}
.names summary{cursor:pointer;color:var(--gold)}
.note{font-size:13px;color:var(--warn);background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.3);border-radius:12px;padding:10px 12px;margin:10px 0}
.pill{display:inline-block;background:var(--card2);border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:3px 10px;margin:3px 4px 0 0;font-size:13px}

/* IDEAS */
.idea{border-bottom:1px solid rgba(255,255,255,.08);padding:12px 0}
.idea:last-child{border-bottom:0}
.idea .by{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.like{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:14px}
.like.on{background:rgba(245,199,106,.25);border-color:var(--gold)}

/* AFISHA */
.poster{position:relative;border:2px solid var(--gold);border-radius:20px;padding:22px 16px 16px;margin:14px 0;background:linear-gradient(160deg,rgba(245,199,106,.18),rgba(18,24,66,.82) 55%);text-align:center;overflow:hidden}
.poster::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:15px;pointer-events:none}
.poster .tag{letter-spacing:.3em;font-size:11px;color:var(--gold);text-transform:uppercase}
.poster .ph{font-family:Georgia,serif;font-weight:700;font-size:clamp(40px,12vw,58px);line-height:1;margin:8px 0 4px;background:linear-gradient(180deg,#fff6d6,#f5c76a 55%,#b9812a);-webkit-background-clip:text;background-clip:text;color:transparent}
.poster .pn{font-size:18px;color:#fff;font-family:Georgia,serif;margin:2px 0 6px}
.poster p{color:var(--text);font-size:14.5px;text-align:left}
.resp{display:inline-flex;gap:10px;align-items:center;background:rgba(5,8,30,.55);border:1px solid var(--gold);border-radius:99px;padding:6px 16px 6px 6px;margin:8px 0}
.resp .av{width:36px;height:36px;font-size:13px}
.resp small{display:block;font-size:11px;color:var(--muted);text-align:left}
.resp b{font-size:15px;display:block;text-align:left}
.gtr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.gtr .g{display:flex;align-items:center;gap:8px;background:rgba(5,8,30,.55);border:1px solid var(--line);border-radius:99px;padding:5px 14px 5px 5px;font-size:14px}
.gtr .g .av{width:30px;height:30px;font-size:12px}
.poster .sect{text-align:left;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.poster .sect h4{margin:0 0 8px;font-size:15px;color:var(--gold2)}

/* PLAN */
.tl{position:relative;margin:6px 0 0 6px;padding-left:20px;border-left:2px solid var(--line)}
.tl .it{position:relative;padding:0 0 16px}
.tl .it::before{content:"";position:absolute;left:-27px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(245,199,106,.2)}
.tl .tm{font-weight:700;color:var(--gold2);font-variant-numeric:tabular-nums}
.tl .tt{font-weight:600}
.tl .td{font-size:14px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
.chk input{width:22px;height:22px;flex:0 0 auto;margin-top:1px;accent-color:#e1a843;padding:0}
.chk.done span{text-decoration:line-through;opacity:.55}
.chk small{display:block;color:var(--muted)}
.calc-r{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.12)}
.calc-r:last-child{border:0}
.calc-r b{font-variant-numeric:tabular-nums;color:var(--gold2);text-align:right}
.empty{color:var(--muted);text-align:center;padding:14px 0}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:18px 0 4px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>

/* ---------- ХЕЛПЕРЫ ХРАНЕНИЯ ---------- */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- ЯЗЫК: основной — казахский ---------- */
let LANG = lsGet("z20lang","kk")==="ru" ? "ru" : "kk";

 ["Көбегенов","Ибрагим","m"],["Кенжеқұлова","Айгүл","f"],["Ізімбергенова","Айгүл","f"],["Сәдуақасова","Жазира","f"],
 ["Балықбаева","Гүлдана","f"],["Меңдіханова","Дина","f"],["Яева","Орынгүл","f"],["Нұрбасинова","Майя","f"],
 ["Тасболатова","Гүлназ","f"],["Жақсығатова","Гүлшат","f"],["Өтешева","Гаухар","f"],["Нуретова","Диана","f"]

/* пары [казахский, русский] */

 {id:"attend",ic:"🙋",q:["Келесіз бе?","Вы придёте?"],hint:["Көлемін түсіну үшін керек","Нужно, чтобы понять масштаб"],type:"single",opts:[

   {id:"may25",l:["25 мамыр (сейсенбі) — дәл соңғы қоңырау күні","25 мая (вторник) — ровно в день последнего звонка"]},
   {id:"sat22",l:["Одан бұрынғы демалыс: 22–23 мамыр","Ближайшие выходные раньше: 22–23 мая"]},

 {id:"place",ic:"📍",q:["Қайда тойлаймыз?","Где отмечаем?"],hint:["Қала, облыс немесе шетел","Город, область или заграница"],type:"single",opts:[

/* ---------- ХРАНИЛИЩЕ: Firebase / jsonblob / локально ---------- */
const MODE = DB_URL ? "fb" : BLOB_ID ? "blob" : "local";
const LOCAL = MODE==="local";
const JB = "https://jsonblob.com/api/jsonBlob/";
const JH = {"Content-Type":"application/json",Accept:"application/json"};
function setPath(t,path,val){
  const p=path.split("/"); let o=t;
  for(let i=0;i<p.length-1;i++){ if(!o[p[i]]||typeof o[p[i]]!=="object") o[p[i]]={}; o=o[p[i]]; }
  if(val===null) delete o[p[p.length-1]]; else o[p[p.length-1]]=val;
}
function getPath(t,path){ return path.split("/").reduce((o,k)=>o==null?undefined:o[k],t); }
const same=(a,b)=>JSON.stringify(a===undefined?null:a)===JSON.stringify(b===undefined?null:b);
function logW(path,val){
  const w=lsGet("z20w",[]).filter(x=>Date.now()-x.t<6e5); w.push({path,val,t:Date.now()}); lsSet("z20w",w.slice(-40));
}
let chain=Promise.resolve();
const db = {
  async all(){
    if(MODE==="local") return lsGet("z20db",{});
    if(MODE==="fb"){
      const r=await fetch(DB_URL.replace(/\/$/,"")+"/.json",{cache:"no-store"});
      if(!r.ok) throw new Error("db "+r.status);
      return (await r.json())||{};
    }
    const r=await fetch(JB+BLOB_ID,{headers:JH,cache:"no-store"});
    if(!r.ok) throw new Error("db "+r.status);
    const d=await r.json(); return d&&typeof d==="object"&&!Array.isArray(d)?d:{};
  },
  set(path,val,noLog){
    if(!noLog) logW(path,val);
    if(MODE==="local"){ const t=lsGet("z20db",{}); setPath(t,path,val); lsSet("z20db",t); return Promise.resolve(); }
    if(MODE==="fb"){
      return fetch(DB_URL.replace(/\/$/,"")+"/"+path+".json",{method:"PUT",body:JSON.stringify(val)})
        .then(r=>{ if(!r.ok) throw new Error("db "+r.status); });
    }
    // jsonblob хранит документ целиком: читаем → правим свою ветку → пишем → проверяем, что запись на месте
    return chain=chain.catch(()=>{}).then(async()=>{
      for(let n=0;n<3;n++){
        const cur=await db.all(); setPath(cur,path,val);
        const r=await fetch(JB+BLOB_ID,{method:"PUT",headers:JH,body:JSON.stringify(cur)});
        if(!r.ok) throw new Error("db "+r.status);
        if(same(getPath(await db.all(),path),val)) return;
      }
      throw new Error("save failed");
    });
  }
};
// если чужая запись одновременно затёрла нашу — досылаем свои недавние изменения
async function reconcile(){
  if(MODE!=="blob") return;
  const w=lsGet("z20w",[]).filter(x=>Date.now()-x.t<6e5); let fixed=false;
  for(const x of w){
    const cur=getPath(S.db,x.path);
    if(x.val===null ? cur!=null : cur==null){ await db.set(x.path,x.val,true); fixed=true; }
  }
  if(fixed) S.db=await db.all();
}

/* ---------- РЕЗУЛЬТАТЫ ---------- */
function results(p){
  const v=votesOf(p.id), ids=Object.keys(v);
  const by={}; p.opts.forEach(o=>by[o.id]={n:0,who:[],vals:[]});
  ids.forEach(vid=>{
    const x=v[vid]; const sel=Array.isArray(x.o)?x.o:[x.o];
    sel.forEach(o=>{ if(by[o]){by[o].n++;by[o].who.push(vid);
      if(x.v!=null&&x.v!==""&&sel.length===1) by[o].vals.push({vid,v:x.v}); }});
  });
  const max=Math.max(0,...Object.values(by).map(b=>b.n));
  return {by,total:ids.length,max};
}
function leader(p){
  const r=results(p); if(!r.total||!r.max) return null;
  const o=p.opts.find(o=>r.by[o.id].n===r.max);
  return {l:P(o.l),pct:Math.round(r.max/r.total*100),n:r.max,total:r.total};
}
function median(a){const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}

/* --- Сауалнама --- */
function optHTML(p,o,r,showRes,dr){
  const b=r.by[o.id], pct=r.total?Math.round(b.n/r.total*100):0;
  const selected = dr.sel.includes(o.id);
  return `<button type="button" class="opt ${selected?"sel":""} ${showRes&&b.n&&b.n===r.max?"lead":""}" data-act="opt" data-p="${p.id}" data-o="${o.id}">
    ${showRes?`<span class="fill" style="width:${pct}%"></span>`:""}
    <span class="in"><span class="lab">${esc(P(o.l))}</span>${showRes?`<span class="num">${b.n} · ${pct}%</span>`:""}</span></button>`;
}
function pollHTML(p){
  const r=results(p), mine=S.me?votesOf(p.id)[S.me]:null;
  const dr = S.draft[p.id] || (S.draft[p.id]={sel:mine?(Array.isArray(mine.o)?[...mine.o]:[mine.o]):[],v:mine&&mine.v!=null?mine.v:""});
  const showRes = !!mine || S.open["r_"+p.id];
  const custom = p.opts.find(o=>o.custom && dr.sel.includes(o.id));
  let extra="";
  p.opts.filter(o=>o.custom).forEach(o=>{
    const vals=r.by[o.id].vals;
    if(showRes&&vals.length){
      if(o.custom==="number"){
        const nums=vals.map(x=>Number(x.v)).filter(n=>n>0);
        if(nums.length) extra+=`<div class="meta">${K("Өз сомалары","Свои суммы")} (${nums.length}): ${K("орташа","среднее")} <b>${fmt(nums.reduce((a,b)=>a+b,0)/nums.length)} ₸</b>, ${K("медиана","медиана")} <b>${fmt(median(nums))} ₸</b><br>${vals.map(x=>`<span class="pill">${esc(nameOf(x.vid).split(" ")[0])}: ${fmt(Number(x.v))} ₸</span>`).join("")}</div>`;
      }else extra+=`<div class="meta">${K("Өз нұсқалары","Свои варианты")}:<br>${vals.map(x=>`<span class="pill">${esc(nameOf(x.vid).split(" ")[0])}: ${esc(x.v)}</span>`).join("")}</div>`;
    }
  });
  const who = showRes && r.total ? `<details class="names"><summary>${K("Кім қалай дауыс берді","Кто как проголосовал")}</summary>${p.opts.filter(o=>r.by[o.id].n).map(o=>`<p><b>${esc(P(o.l))}</b><br>${r.by[o.id].who.map(w=>esc(nameOf(w))).join(", ")}</p>`).join("")}</details>`:"";
  const lead=leader(p);
  return `<details class="card poll" data-pid="${p.id}" ${S.open[p.id]?"open":""}>
    <summary><span class="qi">${p.ic}</span><span class="qt"><b>${esc(P(p.q))}</b><span>${esc(P(p.hint))} · ${K("дауыс","голосов")}: ${r.total}${lead?` · ${K("көш бастап тұр","лидирует")}: ${esc(lead.l.split(" — ")[0])}`:""}</span></span><span class="chev">›</span></summary>
    <div class="pbody">
      ${!S.me?`<div class="note">${K("Алдымен кім екеніңізді таңдаңыз (осы беттің жоғарғы жағында).","Сначала выберите, кто вы (вверху этой страницы).")}</div>`:""}
      ${p.opts.map(o=>optHTML(p,o,r,showRes,dr)).join("")}
      ${custom?`<input data-draft="${p.id}" type="${custom.custom==="number"?"number":"text"}" inputmode="${custom.custom==="number"?"numeric":"text"}" placeholder="${esc(P(custom.ph||["",""]))}" value="${esc(dr.v)}">`:""}
      <div class="row" style="margin-top:10px">
        ${S.me?`<button class="btn" data-act="save" data-p="${p.id}">${mine?K("Дауысты өзгерту","Изменить голос"):K("Дауыс беру","Проголосовать")}</button>`:""}
        ${!mine?`<button class="btn ghost sm" data-act="peek" data-p="${p.id}">${S.open["r_"+p.id]?K("Нәтижені жасыру","Скрыть результаты"):K("Нәтижені көру","Смотреть результаты")}</button>`:""}
      </div>
      ${p.type==="multi"?`<div class="meta">${K("Бірнеше нұсқа таңдауға болады.","Можно выбрать несколько вариантов.")}</div>`:""}
      ${extra}${who}
    </div></details>`;
}

/* --- Универсальный список с лайками (идеи, вопросы квиза, песни) --- */
function listItems(coll,pref,emptyTxt){
  const items=Object.entries(S.db[coll]||{}).map(([id,x])=>({id,...x}));
  const likes=S.db.likes||{}; const cnt=id=>Object.keys(likes[pref+id]||{}).length;
  items.sort((a,b)=>cnt(b.id)-cnt(a.id)||b.ts-a.ts);
  return items.length?items.map(i=>`<div class="idea"><div>${esc(i.t).replace(/\n/g,"<br>")}</div>
    <div class="by"><span>${esc(nameOf(i.by))} · ${new Date(i.ts).toLocaleDateString(locale())}</span>
    <button class="like ${S.me&&(likes[pref+i.id]||{})[S.me]?"on":""}" data-act="like" data-k="${pref}${i.id}">👍 ${cnt(i.id)}</button></div></div>`).join(""):`<div class="empty">${emptyTxt}</div>`;
}
function addRow(coll,ph,btn){
  return `<div class="row"><input data-in="${coll}" maxlength="200" placeholder="${esc(ph)}"><button class="btn sm" data-act="add" data-c="${coll}">${btn}</button></div>`;
}

/* --- Ұстаздар --- */
function viewTeachers(){
  const T=Object.entries(S.db.teachers||{}).map(([id,x])=>({id,...x}));
  const likes=S.db.likes||{}; const cnt=id=>Object.keys(likes["t_"+id]||{}).length;
  T.sort((a,b)=>cnt(b.id)-cnt(a.id)||a.ts-b.ts);

   <div style="margin-top:10px"><button class="btn" data-act="teacher">${K("Қосу","Добавить")}</button></div></div>

   <div class="pname"><b>${esc(t.n)}</b><span>${esc(t.r||"")}${t.r?" · ":""}${K("қосқан","добавил(а)")}: ${esc(nameOf(t.by).split(" ")[0])}</span></div>
   <button class="like ${S.me&&(likes["t_"+t.id]||{})[S.me]?"on":""}" data-act="like" data-k="t_${t.id}">👍 ${cnt(t.id)}</button></div>`).join(""):`<div class="empty">${K("Тізім әзірше бос.","Список пока пуст.")}<br>${K("Ұстаздарды еске түсіріп, жоғарыдан қосыңыз.","Вспомните учителей и добавьте их выше.")}</div>`}</div>`;
}

/* ---------- РЕНДЕР ---------- */
function render(){
  const v={home:viewHome,class:viewClass,polls:viewPolls,ideas:viewIdeas,plan:viewPlan,teachers:viewTeachers,afisha:viewAfisha}[S.tab]||viewHome;
  $("#app").innerHTML = v()+`<div class="foot">${K("Түлектерге 20 жыл · 2027 жылғы 25 мамыр","20 лет выпуска · 25 мая 2027")}</div>`;
  renderNav(); renderMusic(); tick();
  const ws=$("#whoSel"); if(ws) ws.onchange=()=>$("#guestBox").classList.toggle("hide",ws.value!=="guest");
  const q=$("#q"); if(q) q.oninput=()=>{S.q=q.value;const pos=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
  const cf=$("#cFee"),cn=$("#cN");
  if(cf){const up=()=>{lsSet("z20calc",{fee:cf.value,n:cn.value});$("#calcOut").innerHTML=calcOut((+cf.value||0)*(+cn.value||0))};cf.oninput=up;cn.oninput=up}
  document.querySelectorAll("details.poll").forEach(d=>d.addEventListener("toggle",()=>{S.open[d.dataset.pid]=d.open}));
  document.querySelectorAll("[data-draft]").forEach(i=>i.oninput=()=>{S.draft[i.dataset.draft].v=i.value});
}
function tick(){
  const el=$("#cd"); if(!el) return;
  let d=EVENT-new Date(); if(d<0) d=0;
  const D=Math.floor(d/864e5),H=Math.floor(d/36e5)%24,M=Math.floor(d/6e4)%60,Sx=Math.floor(d/1e3)%60;
  el.innerHTML=[[D,K("күн","дней")],[H,K("сағат","часов")],[M,K("минут","минут")],[Sx,K("секунд","секунд")]].map(x=>`<div><b>${String(x[0]).padStart(2,"0")}</b><span>${x[1]}</span></div>`).join("");
}
setInterval(tick,1000);

function setLang(l){
  LANG=l==="ru"?"ru":"kk"; lsSet("z20lang",LANG);
  document.documentElement.lang=LANG;
  document.title=K("Түлектерге 20 жыл · 2027 жылғы 25 мамыр","20 лет выпуска · 25 мая 2027");
  renderTop(); render();
}

/* ---------- МУЗЫКА: две отдельные кнопки (1-музыка / 2-музыка), перемотка только пока играет ---------- */
const TRACKS=[
 {src:"song1.mp3",n:"Магнитола",btn:["1-музыка · Магнитола","Музыка 1 · Магнитола"]},
 {src:"song.mp3",n:"Школа, школа, я скучаю",btn:["2-музыка · Школа","Музыка 2 · Школа"]}
];
const au=new Audio(); au.preload="none"; au.loop=true;
let ti=0, started=false, drag=false;
const mm=s=>{if(!isFinite(s)||s<0)return"0:00";s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const isPlaying=()=>started&&!au.paused;
function renderTop(){
  $("#lang").innerHTML=["kk","ru"].map(l=>`<button type="button" data-act="lang" data-v="${l}" class="${LANG===l?"on":""}">${l==="kk"?"ҚАЗ":"РУС"}</button>`).join("");
  $("#brand").textContent=K("Түлектерге 20 жыл","20 лет выпуска");
  renderNav();
}
function renderMusic(){
  const el=$("#mus"); if(!el) return;
  const pl=isPlaying(), has=isFinite(au.duration)&&au.duration>0;
  el.innerHTML=`<div class="mrow">${TRACKS.map((t,i)=>{
      const on=started&&i===ti;
      return `<button type="button" class="mt ${on?"on":""}" data-act="trk" data-i="${i}">${on&&pl?"⏸":"▶"} ${esc(P(t.btn))}</button>`}).join("")}</div>
    <div class="mseek ${pl?"":"hide"}"><span id="pcur">${mm(au.currentTime)}</span>
      <input type="range" id="pseek" min="0" max="1000" step="1" value="${has?Math.round(au.currentTime/au.duration*1000):0}" ${has?"":"disabled"}>
      <span id="pdur">${has?mm(au.duration):"0:00"}</span></div>`;
}
function playTrack(i){
  ti=i; started=true; au.src=TRACKS[i].src; renderMusic();
  return au.play().catch(err=>{
    if(err&&err.name==="AbortError") return;              // трек сменили вручную
    started=false; renderMusic();
    if(!(err&&err.name==="NotAllowedError")) alert(K("Музыка файлы табылмады: ","Файл музыки не найден: ")+TRACKS[i].src);
  });
}
function trackClick(i){
  if(started&&i===ti){ if(au.paused) au.play().catch(()=>{}); else au.pause(); return; }   // та же кнопка: пауза / дальше
  playTrack(i);                                                                              // другая кнопка: включить её трек
}
["play","pause","loadedmetadata","durationchange"].forEach(e=>au.addEventListener(e,renderMusic));
au.addEventListener("timeupdate",()=>{
  const c=$("#pcur"); if(c) c.textContent=mm(au.currentTime);
  const sk=$("#pseek"); if(sk&&!drag&&isFinite(au.duration)&&au.duration>0) sk.value=Math.round(au.currentTime/au.duration*1000);
});
document.addEventListener("pointerdown",e=>{ if(e.target.id==="pseek") drag=true; });
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,()=>{drag=false}));
document.addEventListener("input",e=>{
  if(e.target.id!=="pseek"||!(isFinite(au.duration)&&au.duration>0)) return;
  au.currentTime=e.target.value/1000*au.duration; const c=$("#pcur"); if(c) c.textContent=mm(au.currentTime);
});

/* ---------- ДЕЙСТВИЯ ---------- */
async function refresh(){
  try{ S.db=await db.all(); await reconcile(); S.err=""; }catch(e){ S.err=String(e.message||e); }
}
async function act(a,el){
  if(a==="tab"){S.tab=el.dataset.v;S.cnote=false;lsSet("z20tab",S.tab);render();window.scrollTo(0,0);
    if(!LOCAL) refresh().then(()=>{ if(S.tab===el.dataset.v&&idle()) render(); });   // подтянуть свежие ответы других при входе на вкладку
    return}
  if(a==="lang"){setLang(el.dataset.v);return}
  if(a==="trk"){trackClick(+el.dataset.i);return}
  if(a==="filter"){S.filter=el.dataset.v;render();return}
  if(a==="who"){
    const id=el.dataset.id;
    if(S.me===id){S.open.att=!S.open.att;render();return}            // своё имя: открыть/закрыть выбор «Келесіз бе?»
    if(S.me){S.cnote=true;render();return}                            // уже вошли как другой человек
    S.me=id; lsSet("z20me",id); S.draft={}; S.open.att=true; S.cnote=false; render(); return;
  }
  if(a==="att"){
    if(!S.me) return;
    await db.set(`votes/attend/${S.me}`,{o:el.dataset.o,t:Date.now()});
    delete S.draft.attend;                                           // опрос «Келесіз бе?» должен показать новый ответ, а не старый черновик
    S.open.att=false; await refresh(); render(); return;
  }
  if(a==="unme"){S.me=null;lsSet("z20me",null);S.draft={};render();return}
  if(a==="setme"){
    const v=$("#whoSel").value; if(!v) return alert(K("Тізімнен өзіңізді таңдаңыз","Выберите себя из списка"));
    if(v==="guest"){
      const n=$("#guestName").value.trim(); if(!n) return alert(K("Аты-жөніңізді жазыңыз","Введите имя"));
      const id="g_"+uid(); await db.set("guests/"+id,{n}); S.me=id;
    }else S.me=v;
    lsSet("z20me",S.me); S.draft={}; await refresh(); render(); return;
  }
  if(a==="opt"){
    const p=POLLS.find(p=>p.id===el.dataset.p), o=el.dataset.o;
    if(!S.me){window.scrollTo({top:0,behavior:"smooth"});return}
    const dr=S.draft[p.id]||(S.draft[p.id]={sel:[],v:""});
    if(p.type==="multi") dr.sel=dr.sel.includes(o)?dr.sel.filter(x=>x!==o):[...dr.sel,o]; else dr.sel=[o];
    S.open[p.id]=true; render(); return;
  }
  if(a==="peek"){S.open["r_"+el.dataset.p]=!S.open["r_"+el.dataset.p];S.open[el.dataset.p]=true;render();return}
  if(a==="save"){
    const p=POLLS.find(p=>p.id===el.dataset.p), dr=S.draft[p.id];
    if(!dr||!dr.sel.length) return alert(K("Нұсқаны таңдаңыз","Выберите вариант"));
    const co=p.opts.find(o=>o.custom&&dr.sel.includes(o.id));
    if(co&&!String(dr.v).trim()) return alert(K("Өз нұсқаңызды жазыңыз","Впишите свой вариант"));
    if(co&&co.custom==="number"&&!(Number(dr.v)>0)) return alert(K("Соманы санмен енгізіңіз","Введите сумму числом"));
    const val={o:p.type==="multi"?dr.sel:dr.sel[0],t:Date.now()};
    if(co&&p.type==="single") val.v=co.custom==="number"?Number(dr.v):String(dr.v).trim();
    try{ await db.set(`votes/${p.id}/${S.me}`,val); S.open[p.id]=true; await refresh(); S.err=""; }
    catch(e){ S.err=String(e.message||e); }
    render(); return;
  }
  if(a==="idea"){
    if(!S.me) return alert(K("Алдымен кім екеніңізді таңдаңыз","Сначала выберите, кто вы"));
    const t=$("#ideaTxt").value.trim(); if(!t) return;
    await db.set("ideas/"+uid(),{t,by:S.me,ts:Date.now()}); await refresh(); render(); return;
  }
  if(a==="add"){
    if(!S.me) return alert(K("Алдымен кім екеніңізді таңдаңыз","Сначала выберите, кто вы"));
    const c=el.dataset.c, inp=document.querySelector(`[data-in="${c}"]`); const t=inp?inp.value.trim():""; if(!t) return;
    await db.set(c+"/"+uid(),{t,by:S.me,ts:Date.now()}); await refresh(); render(); return;
  }
  if(a==="teacher"){
    if(!S.me) return alert(K("Алдымен кім екеніңізді таңдаңыз","Сначала выберите, кто вы"));
    const n=$("#tName").value.trim(); if(!n) return alert(K("Аты-жөнін енгізіңіз","Введите ФИО"));
    await db.set("teachers/"+uid(),{n,r:$("#tRole").value.trim(),by:S.me,ts:Date.now()}); await refresh(); render(); return;
  }
  if(a==="like"){
    if(!S.me) return alert(K("Алдымен кім екеніңізді таңдаңыз","Сначала выберите, кто вы"));
    const k=el.dataset.k, on=((S.db.likes||{})[k]||{})[S.me];
    await db.set(`likes/${k}/${S.me}`,on?null:true); await refresh(); render(); return;
  }
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  e.preventDefault(); act(el.dataset.act,el).catch(err=>{S.err=String(err.message||err);render()});
});
document.addEventListener("change",e=>{
  const c=e.target.closest("[data-chk]"); if(!c) return;
  const d=lsGet("z20chk",{}); d[c.dataset.chk]=c.checked; lsSet("z20chk",d);
  c.closest(".chk").classList.toggle("done",c.checked);
});
function idle(){const a=document.activeElement;return !(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=="range")}
setInterval(async()=>{ if(document.hidden||!idle()||LOCAL) return; await refresh(); render(); },25000);

/* ---------- ФОН: мягкие золотые искры ---------- */
(function(){
  const c=$("#fx"), x=c.getContext("2d"); let W,H,P2=[];
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;P2=Array.from({length:Math.min(46,Math.floor(W*H/22000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,s:Math.random()*.25+.05,a:Math.random()*6.28}))}
  size(); addEventListener("resize",size);
  (function loop(){
    x.clearRect(0,0,W,H);
    P2.forEach(p=>{p.y-=p.s;p.a+=.02;if(p.y<-4){p.y=H+4;p.x=Math.random()*W}
      x.globalAlpha=.25+.35*Math.abs(Math.sin(p.a));x.fillStyle="#ffd98a";x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()});
    requestAnimationFrame(loop);
  })();
})();

/* ---------- СТАРТ ---------- */
document.documentElement.lang=LANG;
document.title=K("Түлектерге 20 жыл · 2027 жылғы 25 мамыр","20 лет выпуска · 25 мая 2027");
renderTop();
render();
refresh().then(render);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
