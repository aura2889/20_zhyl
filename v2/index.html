}

.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- ХРАНИЛИЩЕ ---------- */
const LOCAL = !DB_URL;
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const db = {
  async all(){
    if(LOCAL) return lsGet("z20db",{});
    const r = await fetch(DB_URL.replace(/\/$/,"")+"/.json",{cache:"no-store"});
    if(!r.ok) throw new Error("db "+r.status);
    return (await r.json())||{};
  },
  async set(path,val){
    if(LOCAL){
      const t=lsGet("z20db",{}); const p=path.split("/"); let o=t;
      for(let i=0;i<p.length-1;i++){o=o[p[i]]=o[p[i]]||{}}
      if(val===null) delete o[p[p.length-1]]; else o[p[p.length-1]]=val;
      lsSet("z20db",t); return;
    }
    const r = await fetch(DB_URL.replace(/\/$/,"")+"/"+path+".json",{method:"PUT",body:JSON.stringify(val)});
    if(!r.ok) throw new Error("db "+r.status);
  }
};

const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt = n=>Math.round(n).toLocaleString("ru-RU").replace(/ /g," ");
const cm = id=>CLASSMATES.find(c=>c.id===id);
function nameOf(id){
  const c=cm(id); if(c) return c.sn+" "+c.n;
  const g=(S.db.guests||{})[id]; return g?g.n+" (гость)":"Гость";
}
const votesOf = pid => (S.db.votes||{})[pid]||{};

/* ---------- РЕЗУЛЬТАТЫ ---------- */
function results(p){
  const v=votesOf(p.id), ids=Object.keys(v);
  const by={}; p.opts.forEach(o=>by[o.id]={n:0,who:[],vals:[]});
  ids.forEach(vid=>{
    const x=v[vid]; const sel=Array.isArray(x.o)?x.o:[x.o];
    sel.forEach(o=>{ if(by[o]){by[o].n++;by[o].who.push(vid);
      if(x.v!=null&&x.v!==""&&sel.length===1) by[o].vals.push({vid,v:x.v}); }});
  });
  const max=Math.max(0,...Object.values(by).map(b=>b.n));
  return {by,total:ids.length,max};
}
function leader(p){
  const r=results(p); if(!r.total||!r.max) return null;
  const o=p.opts.find(o=>r.by[o.id].n===r.max);
  return {l:o.l,pct:Math.round(r.max/r.total*100),n:r.max,total:r.total};
}
function median(a){const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}

/* --- Опросы --- */
function optHTML(p,o,r,showRes,mine,dr){
  const b=r.by[o.id], pct=r.total?Math.round(b.n/r.total*100):0;
  const selected = dr.sel.includes(o.id);
  return `<button class="opt ${selected?"sel":""} ${showRes&&b.n&&b.n===r.max?"lead":""}" data-act="opt" data-p="${p.id}" data-o="${o.id}">
    ${showRes?`<span class="fill" style="width:${pct}%"></span>`:""}
    <span class="in"><span class="lab">${esc(o.l)}</span>${showRes?`<span class="num">${b.n} · ${pct}%</span>`:""}</span></button>`;
}
function pollHTML(p){
  const r=results(p), mine=S.me?votesOf(p.id)[S.me]:null;
  const dr = S.draft[p.id] || (S.draft[p.id]={sel:mine?(Array.isArray(mine.o)?[...mine.o]:[mine.o]):[],v:mine&&mine.v!=null?mine.v:""});
  const showRes = !!mine || S.open["r_"+p.id];
  const custom = p.opts.find(o=>o.custom && dr.sel.includes(o.id));
  let extra="";
  p.opts.filter(o=>o.custom).forEach(o=>{
    const vals=r.by[o.id].vals;
    if(showRes&&vals.length){
      if(o.custom==="number"){
        const nums=vals.map(x=>Number(x.v)).filter(n=>n>0);
        if(nums.length) extra+=`<div class="meta">Свои суммы (${nums.length}): среднее <b>${fmt(nums.reduce((a,b)=>a+b,0)/nums.length)} ₸</b>, медиана <b>${fmt(median(nums))} ₸</b><br>${vals.map(x=>`<span class="pill">${esc(nameOf(x.vid).split(" ")[0])}: ${fmt(Number(x.v))} ₸</span>`).join("")}</div>`;
      }else extra+=`<div class="meta">Свои варианты:<br>${vals.map(x=>`<span class="pill">${esc(nameOf(x.vid).split(" ")[0])}: ${esc(x.v)}</span>`).join("")}</div>`;
    }
  });
  const who = showRes && r.total ? `<details class="names"><summary>Кто как проголосовал</summary>${p.opts.filter(o=>r.by[o.id].n).map(o=>`<p><b>${esc(o.l)}</b><br>${r.by[o.id].who.map(w=>esc(nameOf(w))).join(", ")}</p>`).join("")}</details>`:"";
  const lead=leader(p);
  return `<details class="card poll" data-pid="${p.id}" ${S.open[p.id]?"open":""}>
    <summary><span class="qi">${p.ic}</span><span class="qt"><b>${esc(p.q)}</b><span>${esc(p.hint)} · голосов: ${r.total}${lead?` · лидирует: ${esc(lead.l.split(" — ")[0])}`:""}</span></span><span class="chev">›</span></summary>
    <div class="pbody">
      ${!S.me?`<div class="note">Сначала выберите, кто вы (вверху этой страницы).</div>`:""}
      ${p.opts.map(o=>optHTML(p,o,r,showRes,mine,dr)).join("")}
      ${custom?`<input data-draft="${p.id}" type="${custom.custom==="number"?"number":"text"}" inputmode="${custom.custom==="number"?"numeric":"text"}" placeholder="${esc(custom.ph||"")}" value="${esc(dr.v)}">`:""}
      <div class="row" style="margin-top:10px">
        ${S.me?`<button class="btn" data-act="save" data-p="${p.id}">${mine?"Изменить голос":"Проголосовать"}</button>`:""}
        ${!mine?`<button class="btn ghost sm" data-act="peek" data-p="${p.id}">${S.open["r_"+p.id]?"Скрыть результаты":"Смотреть результаты"}</button>`:""}
      </div>
      ${p.type==="multi"?`<div class="meta">Можно выбрать несколько вариантов.</div>`:""}
      ${extra}${who}
    </div></details>`;
}

function render(){
  const v={home:viewHome,class:viewClass,polls:viewPolls,ideas:viewIdeas,plan:viewPlan,teachers:viewTeachers}[S.tab]||viewHome;
  $("#app").innerHTML = v()+`<div class="foot">20 лет выпуска · 25 мая 2027</div>`;
  renderNav(); tick();
  const ws=$("#whoSel"); if(ws) ws.onchange=()=>$("#guestBox").classList.toggle("hide",ws.value!=="guest");
  const q=$("#q"); if(q) q.oninput=()=>{S.q=q.value;const pos=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
  const cf=$("#cFee"),cn=$("#cN");
  if(cf){const up=()=>{lsSet("z20calc",{fee:cf.value,n:cn.value});$("#calcOut").innerHTML=calcOut((+cf.value||0)*(+cn.value||0))};cf.oninput=up;cn.oninput=up}
  document.querySelectorAll("details.poll").forEach(d=>d.addEventListener("toggle",()=>{S.open[d.dataset.pid]=d.open}));
  document.querySelectorAll("[data-draft]").forEach(i=>i.oninput=()=>{S.draft[i.dataset.draft].v=i.value});

function tick(){
  const el=$("#cd"); if(!el) return;
  let d=EVENT-new Date(); if(d<0) d=0;
  const D=Math.floor(d/864e5),H=Math.floor(d/36e5)%24,M=Math.floor(d/6e4)%60,Sx=Math.floor(d/1e3)%60;
  el.innerHTML=[[D,"дней"],[H,"часов"],[M,"минут"],[Sx,"секунд"]].map(x=>`<div><b>${String(x[0]).padStart(2,"0")}</b><span>${x[1]}</span></div>`).join("");
}
setInterval(tick,1000);

/* ---------- ДЕЙСТВИЯ ---------- */
async function refresh(){
  try{ S.db=await db.all(); S.err=""; }catch(e){ S.err=String(e.message||e); }
}
async function act(a,el){
  if(a==="tab"){S.tab=el.dataset.v;lsSet("z20tab",S.tab);render();window.scrollTo(0,0);return}
  if(a==="filter"){S.filter=el.dataset.v;render();return}
  if(a==="unme"){S.me=null;lsSet("z20me",null);S.draft={};render();return}
  if(a==="setme"){
    const v=$("#whoSel").value; if(!v) return alert("Выберите себя из списка");
    if(v==="guest"){
      const n=$("#guestName").value.trim(); if(!n) return alert("Введите имя");
      const id="g_"+uid(); await db.set("guests/"+id,{n}); S.me=id;
    }else S.me=v;
    lsSet("z20me",S.me); S.draft={}; await refresh(); render(); return;
  }
  if(a==="opt"){
    const p=POLLS.find(p=>p.id===el.dataset.p), o=el.dataset.o;
    if(!S.me){window.scrollTo({top:0,behavior:"smooth"});return}
    const dr=S.draft[p.id]||(S.draft[p.id]={sel:[],v:""});
    if(p.type==="multi") dr.sel=dr.sel.includes(o)?dr.sel.filter(x=>x!==o):[...dr.sel,o]; else dr.sel=[o];
    S.open[p.id]=true; render(); return;
  }
  if(a==="peek"){S.open["r_"+el.dataset.p]=!S.open["r_"+el.dataset.p];S.open[el.dataset.p]=true;render();return}
  if(a==="save"){
    const p=POLLS.find(p=>p.id===el.dataset.p), dr=S.draft[p.id];
    if(!dr||!dr.sel.length) return alert("Выберите вариант");
    const co=p.opts.find(o=>o.custom&&dr.sel.includes(o.id));
    if(co&&!String(dr.v).trim()) return alert("Впишите свой вариант");
    if(co&&co.custom==="number"&&!(Number(dr.v)>0)) return alert("Введите сумму числом");
    const val={o:p.type==="multi"?dr.sel:dr.sel[0],t:Date.now()};
    if(co&&p.type==="single") val.v=co.custom==="number"?Number(dr.v):String(dr.v).trim();
    try{ await db.set(`votes/${p.id}/${S.me}`,val); S.open[p.id]=true; await refresh(); S.err=""; }
    catch(e){ S.err=String(e.message||e); }
    render(); return;
  }
  if(a==="idea"){
    if(!S.me) return alert("Сначала выберите, кто вы");
    const t=$("#ideaTxt").value.trim(); if(!t) return;
    await db.set("ideas/"+uid(),{t,by:S.me,ts:Date.now()}); await refresh(); render(); return;
  }
  if(a==="teacher"){
    if(!S.me) return alert("Сначала выберите, кто вы");
    const n=$("#tName").value.trim(); if(!n) return alert("Введите ФИО");
    await db.set("teachers/"+uid(),{n,r:$("#tRole").value.trim(),by:S.me,ts:Date.now()}); await refresh(); render(); return;
  }
  if(a==="like"){
    if(!S.me) return alert("Сначала выберите, кто вы");
    const k=el.dataset.k, on=((S.db.likes||{})[k]||{})[S.me];
    await db.set(`likes/${k}/${S.me}`,on?null:true); await refresh(); render(); return;
  }
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  e.preventDefault(); act(el.dataset.act,el).catch(err=>{S.err=String(err.message||err);render()});
});
document.addEventListener("change",e=>{
  const c=e.target.closest("[data-chk]"); if(!c) return;
  const d=lsGet("z20chk",{}); d[c.dataset.chk]=c.checked; lsSet("z20chk",d);
  c.closest(".chk").classList.toggle("done",c.checked);
});
function idle(){const a=document.activeElement;return !(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))}
setInterval(async()=>{ if(document.hidden||!idle()||LOCAL) return; await refresh(); render(); },25000);

/* ---------- ФОН: мягкие золотые искры ---------- */
(function(){
  const c=$("#fx"), x=c.getContext("2d"); let W,H,P=[];
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(46,Math.floor(W*H/22000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,s:Math.random()*.25+.05,a:Math.random()*6.28}))}
  size(); addEventListener("resize",size);
  (function loop(){
    x.clearRect(0,0,W,H);
    P.forEach(p=>{p.y-=p.s;p.a+=.02;if(p.y<-4){p.y=H+4;p.x=Math.random()*W}
      x.globalAlpha=.25+.35*Math.abs(Math.sin(p.a));x.fillStyle="#ffd98a";x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()});
    requestAnimationFrame(loop);
  })();
})();

/* ---------- СТАРТ ---------- */
render();
refresh().then(render);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
